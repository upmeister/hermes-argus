name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argus-ci:
    name: argus-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install test dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: 'PyYAML==6.0.3'

      - name: Run static checks
        run: |
          python -m py_compile scripts/health-check-v2.py scripts/gen-registry.py tests/probes.py
          bash -n deploy.sh scripts/health-check-v2-wrapper.sh

      - name: Run regression probes
        run: python tests/probes.py
