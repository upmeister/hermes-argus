# 2026-09-06: лимиты памяти для hermes-dashboard
# MemoryHigh = троттлинг, MemoryMax = kill, MemorySwapMax = swap лимит
# Эти значения — рекомендуемый пресет. Настрой под свою VPS:
#   Пресет light (<2GB RAM):    High=300M  Max=450M   SwapMax=100M
#   Пресет normal (2-4GB RAM):  High=45%RAM Max=60%RAM SwapMax=200M
#   Пресет relaxed (>4GB RAM):  High=55%RAM Max=70%RAM SwapMax=300M
# Drop-in override: не сбрасывается при regenerate systemd юнита Hermes'ом
# (в отличие от правки основного .service файла)
[Service]
MemoryMax=1.8G
MemoryHigh=1.2G
MemorySwapMax=200M
OOMScoreAdjust=-100
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=85%