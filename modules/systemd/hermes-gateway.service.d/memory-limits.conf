# 2026-09-06: лимиты памяти для hermes-gateway
# Gateway потребляет меньше, чем dashboard, но критичен для работы Hermes
#   Пресет light (<2GB RAM):    High=200M  Max=350M   SwapMax=100M
#   Пресет normal (2-4GB RAM):  High=25%RAM Max=35%RAM SwapMax=200M
#   Пресет relaxed (>4GB RAM):  High=30%RAM Max=40%RAM SwapMax=300M
# Drop-in override: не сбрасывается при regenerate systemd юнита Hermes'ом
[Service]
MemoryMax=1.0G
MemoryHigh=600M
MemorySwapMax=200M
OOMScoreAdjust=0
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=85%